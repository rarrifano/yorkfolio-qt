app-id: io.github.rarrifano.YorkFolioDesktop
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: yorkfolio-desktop

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network  # quotes (Yahoo Finance), Tesouro Transparente and Banco Central
  # No filesystem access: B3 statements are picked through the file chooser portal.

modules:
  - name: yorkfolio-desktop
    buildsystem: simple
    build-commands:
      # C++ core: shared library with a C ABI, loaded from Python through ctypes
      - make core CXXFLAGS="-O2" CXX=g++
      - install -d /app/share/yorkfolio-desktop
      - cp -r yorkfolio_desktop /app/share/yorkfolio-desktop/
      - find /app/share/yorkfolio-desktop -name __pycache__ -prune -exec rm -rf {} +
      - install -Dm755 flatpak/yorkfolio-desktop /app/bin/yorkfolio-desktop
      - install -Dm644 flatpak/io.github.rarrifano.YorkFolioDesktop.desktop -t /app/share/applications
      - install -Dm644 flatpak/io.github.rarrifano.YorkFolioDesktop.metainfo.xml -t /app/share/metainfo
      - install -Dm644 flatpak/io.github.rarrifano.YorkFolioDesktop.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.rarrifano.YorkFolioDesktop
    sources:
      - type: dir
        path: ..
        skip: [.venv, .git, build, .flatpak-builder, flatpak-build, flatpak-repo, __pycache__, '*.flatpak']
