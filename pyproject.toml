[project]
name = "yorkfolio-qt"
version = "0.1.0"
description = "Desktop (C++ core + Python/Qt) portfolio tracker for B3 investors"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6"]

[project.scripts]
yorkfolio-qt = "yorkfolio_qt.app:main"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E731", "E501", "RUF001", "RUF002", "RUF003", "SIM108", "UP038"]
