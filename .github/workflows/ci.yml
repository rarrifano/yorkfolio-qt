name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1
      - run: make venv
      - run: make test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - run: desktop-file-validate flatpak/io.github.rarrifano.YorkFolioQt.desktop
      - run: appstreamcli validate --no-net flatpak/io.github.rarrifano.YorkFolioQt.metainfo.xml
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.rarrifano.YorkFolioQt.flatpak
          manifest-path: flatpak/io.github.rarrifano.YorkFolioQt.yml
          cache-key: flatpak-${{ github.sha }}
